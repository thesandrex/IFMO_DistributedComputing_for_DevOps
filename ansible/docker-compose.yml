services:
  mysql_master:
    image: mysql:8.0
    container_name: mysql_master
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    volumes:
      - master_data:/var/lib/mysql
      - ./master.conf:/etc/mysql/my.cnf
    networks:
      - wordpress_network

  mysql_replica:
    image: mysql:8.0
    container_name: mysql_replica
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: wp_password
    depends_on:
      - mysql_master
    volumes:
      - replica_data:/var/lib/mysql
      - ./replica.conf:/etc/mysql/my.cnf
    networks:
      - wordpress_network

  wordpress:
    image: wordpress:6.8.1
    container_name: wordpress_app
    restart: always
    expose:
      - "8080"
    environment:
      WORDPRESS_DB_HOST: mysql_master:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: wp_password
    depends_on:
      - mysql_master
    networks:
      - wordpress_network

  nginx:
    image: nginx:1.28.0
    container_name: nginx
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - /etc/ssl/wordpress:/etc/ssl/wordpress
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - wordpress
    networks:
      - wordpress_network

  prometheus:
    image: prom/prometheus:v3.4.0
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - wordpress_network

  node_exporter:
    image: prom/node-exporter:v1.9.0
    container_name: node_exporter
    ports:
      - "9100:9100"
    networks:
      - wordpress_network

  mysqld_exporter:
    image: prom/mysqld-exporter:v0.15.0
    container_name: mysqld_exporter
    volumes:
      - ./mysql_exporter.conf:/home/exporter/.my.cnf
    ports:
      - "9104:9104"
    depends_on:
      - mysql_master
    networks:
      - wordpress_network

  grafana:
    image: grafana/grafana:12.0.1
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
    networks:
      - wordpress_network

networks:
  wordpress_network:
    driver: bridge

volumes:
  master_data:
  replica_data:
  grafana_data:
